name: Build & Publish Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-universal:
    name: Build Universal Wheel & Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install --upgrade pip build wheel setuptools
      - name: Build wheel and sdist
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-dist
          path: dist/*

  build-windows:
    name: Build Windows MSI Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install --upgrade pip wheel setuptools
      - name: Build Wheel
        run: pip wheel . --no-deps -w dist/
      - name: Install WiX Toolset
        run: dotnet tool install --global wix || true
      - name: Build Windows Packages & MSI
        shell: pwsh
        run: |
          .\packaging\windows\build_msi.ps1 -Version "1.1.0"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*

  build-linux:
    name: Build Linux .deb & Tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install --upgrade pip wheel setuptools
      - name: Build Wheel
        run: pip wheel . --no-deps -w dist/
      - name: Build Debian Package
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh
          tar -czvf dist/ulpf-1.1.0-linux-x86_64.tar.gz -C dist $(ls dist/ | grep -E '\.whl$|\.deb$')
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*

  build-macos:
    name: Build macOS .pkg & Tarball
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install --upgrade pip wheel setuptools
      - name: Build Wheel
        run: pip wheel . --no-deps -w dist/
      - name: Build macOS Package
        run: |
          chmod +x packaging/macos/build_pkg.sh
          ./packaging/macos/build_pkg.sh
          tar -czvf dist/ulpf-1.1.0-macos-universal.tar.gz -C dist $(ls dist/ | grep -E '\.whl$|\.pkg$')
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/*

  publish-release:
    name: Create GitHub Release
    needs: [build-universal, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true
      - name: Display release assets
        run: ls -la release_assets/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }} - Universal Multi-Platform Edition"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
