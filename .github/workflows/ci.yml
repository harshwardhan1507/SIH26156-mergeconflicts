name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      # `ruff format` is not enforced yet: applying it touches ~100 files and
      # would bury behavioural diffs in review. Adopt it as one isolated commit
      # (`ruff format src tests`), then re-enable this step.
      - name: mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  framework-only:
    name: Framework installs without the web stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Guards the core promise of the split: `pip install ulpf` must yield a
      # working pipeline with no FastAPI or uvicorn anywhere in the environment.
      - name: Install the framework only
        run: python -m pip install .
      - name: Assert the web stack is absent
        run: |
          if python -c "import fastapi" 2>/dev/null; then
            echo "::error::fastapi was installed by the base package"
            exit 1
          fi
      - name: Run a pipeline end to end
        run: |
          ulpf info
          ulpf ingest --input examples/sample_logs --output /tmp/ci-output
          test -s /tmp/ci-output/events.ndjson

  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Assert no stray top-level packages
        # A flat layout previously shipped the repo's own `packaging/` directory
        # as a top-level module, shadowing the real `packaging` library.
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          tops = {n.split("/")[0] for n in names if "/" in n}
          allowed = {"ulpf", "ulpf_dashboard"} | {t for t in tops if t.endswith(".dist-info")}
          stray = tops - allowed
          assert not stray, f"wheel ships unexpected top-level packages: {sorted(stray)}"
          assert not [n for n in names if "/tests/" in n], "tests must not ship in the wheel"
          print("wheel contents OK:", sorted(tops))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/docker/Dockerfile -t ulpf:ci .
      - name: Run the pipeline inside the image
        run: |
          docker run --rm -v "$PWD/examples/sample_logs:/data:ro" ulpf:ci \
            ingest --input /data --output /app/output
