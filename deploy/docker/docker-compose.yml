# Two services from one image: a batch pipeline run and the operations dashboard.
#
#   docker compose -f deploy/docker/docker-compose.yml up ulpf        # batch ingest
#   docker compose -f deploy/docker/docker-compose.yml up dashboard   # web UI
name: ulpf

x-build: &build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

services:
  # Batch normalization run. No network access at all — this is the air-gapped
  # deployment shape, and it proves the pipeline needs none.
  ulpf:
    build: *build
    image: ulpf:latest
    container_name: ulpf-pipeline
    network_mode: none
    volumes:
      - ulpf-output:/app/output
      - ulpf-data:/app/data
    command:
      - ingest
      - --input
      - /app/sample_logs
      - --output
      - /app/output
      - --log-level
      - INFO
    restart: "no"

  dashboard:
    build: *build
    image: ulpf:latest
    container_name: ulpf-dashboard
    depends_on:
      ulpf:
        condition: service_completed_successfully
    ports:
      # Bound to loopback on the host. Change to "8000:8000" only after setting
      # ULPF_API_KEY, since the write endpoints are otherwise unauthenticated.
      - "127.0.0.1:8000:8000"
    volumes:
      - ulpf-output:/app/output
      - ulpf-data:/app/data
    environment:
      # REQUIRED before exposing this service beyond loopback: gates the
      # ingest, reindex, source-management and live-monitor endpoints.
      ULPF_API_KEY: ${ULPF_API_KEY:?set ULPF_API_KEY before starting the dashboard}
      # Set when the published host port differs from 8000, so the browser
      # origin the dashboard is actually served from passes the CORS check.
      ULPF_CORS_ORIGINS: ${ULPF_CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    entrypoint: ["ulpf-dashboard"]
    command:
      - --output-dir
      - /app/output
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --no-open-browser
    restart: unless-stopped

volumes:
  ulpf-output:
  ulpf-data:
