services:
  ulpf:
    build:
      context: ..          # project root
      dockerfile: docker/Dockerfile
    image: ulpf:latest
    container_name: ulpf-pipeline
    # Disable all network access (air-gap simulation)
    network_mode: none
    volumes:
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - ingest
      - --input
      - /app/sample_logs
      - --output
      - /app/output
      - --log-level
      - INFO
    restart: "no"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ulpf:latest
    container_name: ulpf-dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - ULPF_OUTPUT_DIR=/app/output
      # Uncomment and set to require X-API-Key on ingest/reindex/live-monitor
      # endpoints — recommended since this service is published to the host
      # network (network_mode: none only applies to the batch 'ulpf' service).
      # - ULPF_API_KEY=change-me
      # If the mapped host port differs from 8000, set this so the browser
      # origin the dashboard is actually served from is allowed by CORS:
      # - ULPF_CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    entrypoint: ["ulpf-dashboard"]
    command:
      - --output-dir
      - /app/output
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    restart: unless-stopped
